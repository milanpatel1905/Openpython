[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openpython-notebook"
version = "0.1.0"
description = "A tiny OpenAI-compatible coding assistant for Jupyter notebooks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Openpython contributors" }]
keywords = ["jupyter", "notebook", "python", "code-generation", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: IPython",
  "Framework :: Jupyter",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/milanpatel1905/Openpython"
Repository = "https://github.com/milanpatel1905/Openpython"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
